name: CI

on:
  push:
    branches: [main, "feat/**", "hotfix/**"]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Linter (ruff)
        run: ruff check .

      - name: Testes unitários
        run: pytest tests/unit --no-cov

      - name: Testes de integração
        run: pytest tests/integration --no-cov

      - name: Testes E2E
        run: pytest tests/e2e --no-cov

      - name: Suíte completa com cobertura
        run: pytest --cov-report=html --junitxml=resultado-dos-testes.xml

      - name: Coverage gate (linhas 85% e branches 80%)
        run: python scripts/verificar_cobertura.py

      - name: Publicar logs e relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-cobertura-e-logs
          path: |
            coverage.xml
            htmlcov/
            resultado-dos-testes.xml